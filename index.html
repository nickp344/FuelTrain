<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Hello, world!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #f4f7fb; background: radial-gradient(ellipse at 50% 12%, #203a67 0, #101827 48%, #090e17 100%); }
    main { width: min(92vw, 720px); padding: clamp(2rem, 7vw, 5rem); text-align: center; border: 1px solid #ffffff20; border-radius: 28px; background: #ffffff08; box-shadow: 0 28px 90px #0006; }
    .eyebrow { margin: 0 0 1.25rem; color: #9bbcff; font-size: .78rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3.5rem, 12vw, 7rem); line-height: .95; letter-spacing: -.075em; }
    h1 span { color: #83aaff; }
    p { margin: 1.5rem 0 0; color: #bac5d6; font-size: clamp(1rem, 2.5vw, 1.2rem); line-height: 1.6; }
    .spark { display: inline-block; margin-top: 2rem; font-size: 1.7rem; animation: float 2.5s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-7px) rotate(8deg); } }
    @media (prefers-reduced-motion: reduce) { .spark { animation: none; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">A small beginning</p>
    <h1>Hello,<br><span>world!</span></h1>
    <p>Your next great idea starts right here.</p>
    <span class="spark" aria-hidden="true">✦</span>
  </main>
</body>
</html>
